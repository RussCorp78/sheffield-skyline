<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<meta name="screen-orientation" content="portrait">

<title>Sheffield Skyline</title>

<link rel="stylesheet" href="style.css"> 
  
</head>

<body>

  <div class="logo-top-left">
      <img src="logo.png" alt="Logo">
    </div>
  
  <div class="app-frame">

  <main class="app-content">

<!-- CAMERA -->
<video id="camera" autoplay playsinline muted> </video>
    
<!-- AR OVERLAY -->
<div id="sky">

<div id="title"> Sheffield Skyline q </div>

<div id="toolbar">
  <label>
    <input type="checkbox" id="showLandmarks" checked>
    Landmarks
  </label>
  <label>
    <input type="checkbox" id="showHills" checked>
    Hills
  </label>
</div>
  
<button id="start"> Start Compass </button>
  
<button id="stop" style="display:none;"> Exit Camera </button>
  
<div id="status"> Waiting to start… </div>

<div id="compass"> N </div>

<div id="arLayer">  
  <div id="terrainOverlay"></div>
  <div id="seaLevel"></div>
</div> 
  
<div id="landmarkInfo">
  <h2 id="infoName"></h2>
  <p id="infoHeight"></p>
  <p id="infoText"></p>
  <button id="closeInfo">Close</button>
</div>
  
</div>



<script>


/* =====================================================
BUILDINGS
===================================================== */

let buildings = [];

async function loadBuildings() {

    try {

        const response =
            await fetch("buildings.json?t=" + Date.now());

        const loadedBuildings =
            await response.json();

        // Remove any marker that might have appeared
        // while the data was loading
        document
            .querySelectorAll("#arLayer .building")
            .forEach(marker => {
                marker.remove();
            });

        // Store the newly loaded data
        buildings = loadedBuildings;

        console.log(
            "Buildings loaded",
            buildings.length
        );

        document
            .getElementById("compass")
            .innerText =
            "Buildings loaded: " +
            buildings.length +
            " buildings";

        updateBuildings();

    } catch (error) {

        console.error(
            "Could not load buildings:",
            error
        );

        status.innerText =
            "Could not load building data.";
    }
}


/* =====================================================
VARIABLES
===================================================== */

let userLat = null;
let userLon = null;
let userElevation = null;
let heading = null;
let phonePitch = 0;
let phoneRoll = 0;

const pitchOffset = 10;

const status = document.getElementById("status");
const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");
const camera = document.getElementById("camera");
const landmarkInfo = document.getElementById("landmarkInfo");
const infoName = document.getElementById("infoName");
const infoHeight = document.getElementById("infoHeight");
const infoText = document.getElementById("infoText");
const closeInfo = document.getElementById("closeInfo");

function showLandmarkInfo(building) {
infoName.innerText =
building.name;
infoHeight.innerText =
"Height: " +
building.height +
" m";
infoText.innerText =
building.info;
landmarkInfo.style.display =
"block";
}
closeInfo.addEventListener(
"click",
() => {
landmarkInfo.style.display =
"none";
}
);

/* =====================================================
DISTANCE
===================================================== */

function distance(
lat1,
lon1,
lat2,
lon2
) {

const R = 6371000;


const p1 =
lat1 *
Math.PI / 180;


const p2 =
lat2 *
Math.PI / 180;


const dp =
(lat2 - lat1) *
Math.PI / 180;


const dl =
(lon2 - lon1) *
Math.PI / 180;


const a =

Math.sin(dp / 2) *
Math.sin(dp / 2)

+

Math.cos(p1) *
Math.cos(p2) *
Math.sin(dl / 2) *
Math.sin(dl / 2);


const c =

2 *
Math.atan2(
Math.sqrt(a),
Math.sqrt(1 - a)
);


return R * c;

}



/* =====================================================
BEARING
===================================================== */

function bearing(
lat1,
lon1,
lat2,
lon2
) {

const p1 =
lat1 *
Math.PI / 180;


const p2 =
lat2 *
Math.PI / 180;


const dl =
(lon2 - lon1) *
Math.PI / 180;


const y =
Math.sin(dl) *
Math.cos(p2);


const x =

Math.cos(p1) *
Math.sin(p2)

-

Math.sin(p1) *
Math.cos(p2) *
Math.cos(dl);


let b =

Math.atan2(y, x) *
180 / Math.PI;


return (
b + 360
) % 360;

}



/* =====================================================
UPDATE BUILDINGS
===================================================== */

function updateBuildings() {

/* Original Ground position on screen
const groundY =
  60 - (groundElevation * 0.2); */

/* updated Ground position based on pitch and elevation of phone */
const verticalFieldOfView = 60;
const calibratedPitch = phonePitch;  
const seaLevelDifference = 0;

const seaLevelAngle =
    Math.atan2(
        seaLevelDifference,
        1000
    ) * 180 / Math.PI;

/* to replace when sorted
const seaLevelY =
    35 -
    (
        (calibratedPitch - seaLevelAngle) /
        verticalFieldOfView
    ) * 100;  */

const seaLevelY =
    60 - (calibratedPitch * 0.5);

document.getElementById("seaLevel").style.top =
    seaLevelY + "%";
  
document.getElementById("arLayer").style.transform =
    `rotate(${-phoneRoll * 0.1}deg)`;
  
const seaLevelPercent =
    Math.max(
        0,
        Math.min(
            100,
            seaLevelY
        )
    );

  document.getElementById("terrainOverlay")
    .style.background =
    `linear-gradient(
        to bottom,
        rgba(135,206,235,0.15) 0%,
        rgba(135,206,235,0.08) ${seaLevelPercent}%,
        rgba(89,99,78,0.08) ${seaLevelPercent}%,
        rgba(89,99,78,0.15) 100%
    )`;
  
    
if (
userLat === null ||
userLon === null ||
userElevation === null ||
heading === null
) {
return;
}

const showBuildings =
    document.getElementById("showLandmarks").checked;
status.style.display = "block";

status.innerText =
    "Buildings loaded: " +
    buildings.length;
  
const showHills =
    document.getElementById("showHills").checked;
  
buildings.forEach(building => {

  if (
    building.type === "building" &&
    !showBuildings
) {
    if (building.marker) {
        building.marker.style.display = "none";
    }
    return;
}

if (
    building.type === "hill" &&
    !showHills
) {
    if (building.marker) {
        building.marker.style.display = "none";
    }
    return;
}
  
// Create the building marker 

if (!building.marker) {

  
building.marker =
  document.createElement("div");

building.marker.className =
"building";

/* Building line */
  
const line =
  document.createElement("div");

line.className =
  "building-line";

if (building.type === "hill") {
    line.style.background = "dodgerblue";
}
else {
    line.style.background = "red";
}  
  
building.marker.appendChild(line);

  /* Building name */

const label =
    document.createElement("span");

label.className =
    "building-label";

label.innerText =
    building.name;

if (building.type === "hill") {
    label.style.background =
        "rgba(30,144,255,0.8)";
}  
  
building.marker.appendChild(label);

/* Click information */
  
building.marker.addEventListener(
"click",
() => {
showLandmarkInfo(building);
}
);
  
document
.getElementById("arLayer")
.appendChild(building.marker);
}
building.marker.style.display = "block";
/*  
if (
    (building.type === "building" && !showBuildings) ||
    (building.type === "hill" && !showHills)
) {
    building.marker.style.display = "none";
    return;
}
*/
// Calculate distance
const buildingDistance =
distance(
userLat,
userLon,
building.lat,
building.lon
);


// Calculate bearing
const b =
bearing(
userLat,
userLon,
building.lat,
building.lon
);

/* Horizontal difference */

let difference =
b - heading;

difference =
(difference + 540) % 360 - 180;


// Hide buildings outside our 120° view
if (Math.abs(difference) > 60) {

building.marker.style.display = "none";

return;
  
} else {
  building.marker.style.display = "block";
}

// Horizontal position
const screenX =
50 +
(difference / 60) * 50;


building.marker.style.left =
screenX + "%";

/* -----------------------------------------------------
ELEVATION
----------------------------------------------------- */

/* Ground elevation of the building */

const groundElevation =
  Number(building.Elevation);


/* Top of the building */

const topElevation =
  groundElevation +
  Number(building.height);


/* Height difference between us and building ground 
const groundDifference =
    groundElevation - userElevation;
*/
  
/* using instead of difference between us and building ground */
  
const groundDifference =
  groundElevation;


/* Height difference between us and building top */

const topDifference =
  topElevation -
  userElevation;


/* Calculate vertical angles */

const groundAngle =
  Math.atan2(
    groundDifference,
    buildingDistance
  ) * 180 / Math.PI;


const topAngle =
  Math.atan2(
    topDifference,
    buildingDistance
  ) * 180 / Math.PI;


/* -----------------------------------------------------
VERTICAL SCREEN SCALE
----------------------------------------------------- */

const verticalScale = 3;




const relativeVerticalAngle =
    groundAngle - calibratedPitch;
  
/* elevation based on distance: const groundY = 30 - (relativeVerticalAngle / verticalFieldOfView) * 100;  */
  
/* elevation ignoring distance: const groundY = 40 - (groundElevation * 0.04) - (calibratedPitch * 0.5);  */

  /* elevation relative to sea level line */
const elevationScale = 0.12;

const groundY =
    seaLevelY -
    (groundElevation * elevationScale);
  

/* old height codes
const lineHeight =
    Math.max(
        25,
        Math.min(
            180,
            Number(building.height) * 1.5
        )
    );

    const lineHeight =
    Math.max(
        10,
        Math.min(
            200,
            (building.height * 400) /
            buildingDistance
        )
    );

    */
/* -----------------------------------------------------
CALCULATE BUILDING HEIGHT ON SCREEN
----------------------------------------------------- */

const skyHeight =
    document
        .getElementById("sky")
        .clientHeight;
/* line height when elevation stays the same */
  
let lineHeight;

if (building.type === "hill") {

    lineHeight =
        Math.abs(
            seaLevelY - groundY
        ) * skyHeight / 100;

} else {

    lineHeight =
        Math.max(
            10,
            Math.min(
                200,
                (building.height * 400) /
                buildingDistance
            )
        );
}

/* Top position on screen */

const topY =
  50 -
  (topAngle * verticalScale);


/* Height of building on screen 
const groundY =
  50 -
  (groundAngle * verticalScale);
  
const lineHeight =
  Math.abs(groundY - topY) *
  window.innerHeight /
  100;

  const lineHeight =
    Math.abs(groundY - topY) *
    skyHeight /
    100;
*/

/* -----------------------------------------------------
POSITION MARKER AT BUILDING GROUND
----------------------------------------------------- */

if (building.type === "hill") {

    building.marker.style.top =
        seaLevelY + "%";

} else {

    building.marker.style.top =
        groundY + "%";

}

/* -----------------------------------------------------
POSITION BUILDING LINE
----------------------------------------------------- */

const line =
    building.marker
        .querySelector(".building-line");

line.style.height =
    lineHeight + "px";


/* -----------------------------------------------------
POSITION LABEL ABOVE BUILDING LINE
----------------------------------------------------- */

const label =
    building.marker
        .querySelector(".building-label");

label.style.bottom = "0px";
  
/* -----------------------------------------------------
POSITION LABEL AT BUILDING TOP


building.marker.style.top =
  topY + "%";
  

const line =
  building.marker.querySelector(
    ".building-line"
  );

const lineHeight =
  Math.abs(groundY - topY) *
  window.innerHeight /
  100;
  
line.style.height =
  lineHeight + "px";


----------------------------------------------------- */

// Smaller text for distant buildings
const size =
Math.max(
9,
Math.min(
15,
18 -
(buildingDistance / 1000)
)
);


building.marker.style.fontSize =
size + "px";
  
});
}

/* =====================================================
LOCATION
===================================================== */

function getLocation() {


if (
!navigator.geolocation
) {

status.innerText =
"Location isn't available.";

return;

}



status.innerText =
"Getting your location…";



navigator
.geolocation
.getCurrentPosition(

position => {

userLat = position.coords.latitude;
userLon = position.coords.longitude;
userElevation = position.coords.altitude;
  console.log(position.coords);
/*
if (userElevation !== null) {

   status.innerText =
     "Elev: " +
    Math.round(userElevation) +
    "m | Pitch: " +
    Math.round(phonePitch) +
    "° | Roll: " +
    Math.round(phoneRoll) +
    "°";

} else {

    status.innerText =
        "Elevation unavailable";
}
*/


loadBuildings();

status.style.display = "block";

},


error => {


status.innerText =

"Couldn't get your location: " +

error.message;

},


{

enableHighAccuracy:
true,

timeout:
10000,

maximumAge:
0

}

);

}



/* =====================================================
CAMERA
===================================================== */

async function startCamera() {

    try {

        status.style.display = "block";
        status.innerText = "Starting camera…";

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                },
                audio: false
            });

        camera.srcObject = stream;
        camera.style.display = "block";

        await camera.play();
      
        status.style.display = "none";
      
        // Remove the holding-screen background
        document
            .getElementById("sky")
            .classList.add("camera-active");

        // Switch the buttons
        startButton.style.display = "none";
        title.style.display = "none";
        stopButton.style.display = "block";

       /* status update
       status.innerText =
            "Camera started. Starting compass…";
      */
      
    } catch (error) {

        status.style.display = "block";

        status.innerText =
            "Camera error: " +
            error.name +
            " - " +
            error.message;

        console.error(error);
    }
}


/* =====================================================
STOP CAMERA
===================================================== */

function stopCamera() {

    // Stop orientation updates first
    window.removeEventListener(
        "deviceorientation",
        handleOrientation,
        true
    );

    window.removeEventListener(
        "deviceorientationabsolute",
        handleOrientation,
        true
    );

    // Reset stored readings
    heading = null;
    userLat = null;
    userLon = null;
    userElevation = null;
    phonePitch = 0;
    phoneRoll = 0;

    // Stop all camera tracks
    if (camera.srcObject) {
        camera.srcObject
            .getTracks()
            .forEach(track => track.stop());

        camera.srcObject = null;
    }

    // Hide the camera
    camera.style.display = "none";

    // Restore the holding-screen background
    document
        .getElementById("sky")
        .classList.remove("camera-active");

    // Remove only the building markers
    document
        .querySelectorAll("#arLayer .building")
        .forEach(marker => {
            marker.remove();
        });

    // Empty the building data so old markers cannot be
    // recreated while buildings.json reloads
    buildings = [];

    // Reset the AR layer's rotation
    document
        .getElementById("arLayer")
        .style.transform = "rotate(0deg)";

    // Reset the sea-level line
    document
        .getElementById("seaLevel")
        .style.top = "60%";

    // Close the landmark information panel
    landmarkInfo.style.display = "none";

    // Restore buttons
    startButton.style.display = "block";
    stopButton.style.display = "none";

    // Reset compass
    document
        .getElementById("compass")
        .innerText = "N";

    // Restore status
    status.style.display = "block";
    status.innerText = "Ready to start";
}

/* =====================================================
COMPASS
===================================================== */

function startCompass() {


if (

typeof DeviceOrientationEvent !==
"undefined"

&&

typeof
DeviceOrientationEvent
.requestPermission ===
"function"

) {


DeviceOrientationEvent

.requestPermission(true)

.then(permission => {


if (
permission ===
"granted"
) {


window
.addEventListener(

"deviceorientation",

handleOrientation,

true

);


status.innerText =
"Compass enabled. Finding location…";
startButton.style.display = "none";
getLocation();


}

else {


status.innerText =
"Compass permission was denied.";

}

})


.catch(error => {


status.innerText =
"Compass error: " +
error;

});


}

else {


window
.addEventListener(

"deviceorientationabsolute",

handleOrientation,

true

);


window
.addEventListener(

"deviceorientation",

handleOrientation,

true

);

startButton.style.display = "none";
getLocation();

}

}



/* =====================================================
ORIENTATION
===================================================== */

function handleOrientation(event) {


let newHeading = null;

/* iPhone / Safari */

if (

typeof
event.webkitCompassHeading ===
"number"

) {


newHeading =
event.webkitCompassHeading;

}

/*  Other browsers */

else if (

typeof event.alpha ===
"number"
) {

newHeading = 
  360 - event.alpha;
}
  
/* up/down angle */
  if (typeof event.beta === "number") {
    phonePitch = 90 - event.beta;
}

/* roll angle */

if (typeof event.gamma === "number") {
    phoneRoll = event.gamma;
}
  
if (newHeading !== null) {
  
heading = newHeading;

/* Display heading in compass circle */

document
.getElementById("compass")
.innerText =
  Math.round(heading) + "°";

/* show updated elevation and pitch in status bar commented out for now
  
status.innerText =
    "Elev: " +
    Math.round(userElevation) +
    "m | Pitch: " +
    Math.round(phonePitch) +
    "° | Roll: " +
    Math.round(phoneRoll) +
    "°";
*/  
/* Add Heading in the status bar at the bottom
status.innerText = "Heading: " +
  Math.round(heading) + "°";
*/
  
updateBuildings();
}

}

/* =====================================================
FILTER CHECKBOXES
===================================================== */

document
    .getElementById("showLandmarks")
    .addEventListener("change", updateBuildings);

document
    .getElementById("showHills")
    .addEventListener("change", updateBuildings);    
  
/* =====================================================
START & STOP BUTTONS
===================================================== */

startButton.addEventListener(
    "click",
    () => {
        startCamera();
        startCompass();
    }
);

stopButton.addEventListener(
    "click",
    stopCamera
);
  
</script>
      </main>
    </div>
</body>
