<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Sheffield Skyline</title>


<style>

/* ---------------------------
BASIC PAGE
--------------------------- */

* {
box-sizing: border-box;
}

html,
body {

margin: 0;
padding: 0;

width: 100%;
height: 100%;

overflow: hidden;

font-family: Arial, sans-serif;

background: #111;
}


/* ---------------------------
CAMERA
--------------------------- */

#camera {

position: fixed;

top: 0;
left: 0;

width: 100vw;
height: 100vh;

object-fit: cover;

z-index: 1;

background: black;
}


/* ---------------------------
OVERLAY
--------------------------- */

#sky {

position: fixed;

top: 0;
left: 0;

width: 100vw;
height: 100vh;

background: transparent;

z-index: 2;
}


/* ---------------------------
TITLE
--------------------------- */

#title {

position: absolute;

top: 20px;
left: 20px;
right: 20px;

text-align: center;

color: white;

font-size: 24px;

font-weight: bold;

text-shadow: 0 2px 5px #000;

z-index: 10;
}


/* ---------------------------
START BUTTON
--------------------------- */

#start {

position: absolute;

top: 70px;

left: 50%;

transform:
translateX(-50%);

padding:
14px 22px;

border: none;

border-radius: 25px;

background: white;

color: #222;

font-size: 17px;

font-weight: bold;

z-index: 100;

pointer-events: auto;
}


/* ---------------------------
STATUS
--------------------------- */

#status {

position: absolute;

bottom: 20px;

left: 20px;
right: 20px;

padding: 12px;

background:
rgba(0,0,0,0.7);

color: white;

border-radius: 10px;

text-align: center;

z-index: 20;
}


/* ---------------------------
COMPASS DISPLAY
--------------------------- */

#compass {

position: absolute;

top: 50%;
left: 50%;

transform:
translate(-50%, -50%);

width: 70px;
height: 70px;

border:
3px solid white;

border-radius: 50%;

background:
rgba(0,0,0,0.4);

color: white;

display: flex;

align-items: center;
justify-content: center;

font-size: 18px;

font-weight: bold;

z-index: 15;
}


/* ---------------------------
BUILDING LABEL
--------------------------- */

.building {

position: absolute;

transform:
translate(-50%, -50%);

padding:
7px 10px;

background:
rgba(0,0,0,0.75);

color: white;

border-radius: 8px;

white-space: nowrap;

font-size: 12px;

font-weight: bold;

box-shadow:
0 2px 8px
rgba(0,0,0,0.4);

z-index: 10;
}


/* ---------------------------
BUILDING DOT
--------------------------- */

.building::after {

content: "";

position: absolute;

width: 8px;
height: 8px;

background: white;

border-radius: 50%;

bottom: -14px;

left: 50%;

transform:
translateX(-50%);
}

</style>

</head>


<body>


<!-- CAMERA -->

<video
id="camera"
autoplay
playsinline
muted>
</video>


<!-- AR OVERLAY -->

<div id="sky">


<div id="title">
Sheffield Skyline v1.7
</div>


<button id="start">
Start Compass
</button>


<div id="status">
Waiting to start…
</div>


<div id="compass">
N
</div>


</div>



<script>


/* =====================================================
BUILDINGS
===================================================== */

let buildings = [];

  async function loadBuildings() {
    try {
      const response = await fethc("buildings.json");

      buildings = await response.json();

      console.log("Buildings loaded", buildings.length);

      updateBuildings()

    } catch error {
      console.error("Could not load buildings:", error);
      status.innerText = "Could not load building data.";
    }
  }


/* =====================================================
VARIABLES
===================================================== */

let userLat = null;

let userLon = null;

let heading = null;



const status =
document.getElementById("status");

const startButton =
document.getElementById("start");

const camera =
document.getElementById("camera");



/* =====================================================
DISTANCE
===================================================== */

function distance(
lat1,
lon1,
lat2,
lon2
) {

const R = 6371000;


const p1 =
lat1 *
Math.PI / 180;


const p2 =
lat2 *
Math.PI / 180;


const dp =
(lat2 - lat1) *
Math.PI / 180;


const dl =
(lon2 - lon1) *
Math.PI / 180;


const a =

Math.sin(dp / 2) *
Math.sin(dp / 2)

+

Math.cos(p1) *
Math.cos(p2) *
Math.sin(dl / 2) *
Math.sin(dl / 2);


const c =

2 *
Math.atan2(
Math.sqrt(a),
Math.sqrt(1 - a)
);


return R * c;

}



/* =====================================================
BEARING
===================================================== */

function bearing(
lat1,
lon1,
lat2,
lon2
) {

const p1 =
lat1 *
Math.PI / 180;


const p2 =
lat2 *
Math.PI / 180;


const dl =
(lon2 - lon1) *
Math.PI / 180;


const y =
Math.sin(dl) *
Math.cos(p2);


const x =

Math.cos(p1) *
Math.sin(p2)

-

Math.sin(p1) *
Math.cos(p2) *
Math.cos(dl);


let b =

Math.atan2(y, x) *
180 / Math.PI;


return (
b + 360
) % 360;

}



/* =====================================================
UPDATE BUILDINGS
===================================================== */

function updateBuildings() {

if (
userLat === null ||
userLon === null ||
heading === null
) {
return;
}

buildings.forEach(building => {

// Create the label once
if (!building.marker) {

building.marker =
document.createElement("div");

building.marker.className =
"building";

building.marker.innerText =
building.name;

document
.getElementById("sky")
.appendChild(building.marker);
}


// Calculate distance
const buildingDistance =
distance(
userLat,
userLon,
building.lat,
building.lon
);


// Calculate bearing
const b =
bearing(
userLat,
userLon,
building.lat,
building.lon
);


// Difference between building direction
// and the direction the phone is pointing
let difference =
b - heading;

difference =
(difference + 540) % 360 - 180;


// Hide buildings outside our 120° view
if (Math.abs(difference) > 60) {

building.marker.style.display =
"none";

return;
}


// Show the building
building.marker.style.display =
"block";


// Horizontal position
const screenX =
50 +
(difference / 60) * 50;


building.marker.style.left =
screenX + "%";


// Keep the same temporary height
building.marker.style.top =
"45%";


// Smaller text for distant buildings
const size =
Math.max(
9,
Math.min(
15,
18 -
(buildingDistance / 1000)
)
);


building.marker.style.fontSize =
size + "px";

});
}

/* =====================================================
LOCATION
===================================================== */

function getLocation() {


if (
!navigator.geolocation
) {

status.innerText =
"Location isn't available.";

return;

}



status.innerText =
"Getting your location…";



navigator
.geolocation
.getCurrentPosition(

position => {


userLat =
position.coords.latitude;


userLon =
position.coords.longitude;



status.innerText =
"Location found. Point your phone around.";


loadBuildings();

},


error => {


status.innerText =

"Couldn't get your location: " +

error.message;

},


{

enableHighAccuracy:
true,

timeout:
10000,

maximumAge:
0

}

);

}



/* =====================================================
CAMERA
===================================================== */

async function startCamera() {


try {


status.innerText =
"Starting camera…";


const stream =

await navigator
.mediaDevices
.getUserMedia({

video: {

facingMode: {
ideal:
"environment"
}

},

audio: false

});



camera.srcObject =
stream;



await camera.play();



status.innerText =
"Camera started. Starting compass…";


}

catch (error) {


status.innerText =

"Camera error: " +

error.name +

" - " +

error.message;


console.error(error);

}

}



/* =====================================================
COMPASS
===================================================== */

function startCompass() {


if (

typeof DeviceOrientationEvent !==
"undefined"

&&

typeof
DeviceOrientationEvent
.requestPermission ===
"function"

) {


DeviceOrientationEvent

.requestPermission(true)

.then(permission => {


if (
permission ===
"granted"
) {


window
.addEventListener(

"deviceorientation",

handleOrientation,

true

);


status.innerText =
"Compass enabled. Finding location…";
startButton.style.display = "none";
getLocation();


}

else {


status.innerText =
"Compass permission was denied.";

}

})


.catch(error => {


status.innerText =
"Compass error: " +
error;

});


}

else {


window
.addEventListener(

"deviceorientationabsolute",

handleOrientation,

true

);


window
.addEventListener(

"deviceorientation",

handleOrientation,

true

);

startButton.style.display = "none";
getLocation();

}

}



/* =====================================================
ORIENTATION
===================================================== */

function handleOrientation(event) {


let newHeading = null;



/*

iPhone / Safari

*/

if (

typeof
event.webkitCompassHeading ===
"number"

) {


newHeading =
event.webkitCompassHeading;

}



/*

Other browsers

*/

else if (

typeof event.alpha ===
"number"

) {


newHeading = 
  360 - event.alpha;

}

if (newHeading !== null) {
  
heading = newHeading;

/*
Display heading.
*/

document
.getElementById("compass")
.innerText =
  Math.round(heading) + "°";

status.innerText = "Heading: " +
  Math.round(heading) + "°";

updateBuildings();
}

}

/* =====================================================
START BUTTON
===================================================== */

startButton.addEventListener(

"click",

() => {

startCamera();

startCompass();

}

);

</script>

</body>

</html>
