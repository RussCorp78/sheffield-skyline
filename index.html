
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Sheffield Skyline</title>

<style>
* {
box-sizing: border-box;
}

html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
font-family: Arial, sans-serif;
background: #111;
}

#sky {
position: relative;
width: 100%;
height: 100%;
background:
linear-gradient(
to bottom,
#87ceeb 0%,
#dff3ff 65%,
#9ca58d 65%,
#59634e 100%
);
}

#title {
position: absolute;
top: 20px;
left: 20px;
right: 20px;
text-align: center;
color: white;
font-size: 24px;
font-weight: bold;
text-shadow: 0 2px 5px #000;
z-index: 10;
}

#status {
position: absolute;
bottom: 20px;
left: 20px;
right: 20px;
padding: 12px;
background: rgba(0,0,0,0.7);
color: white;
border-radius: 10px;
text-align: center;
z-index: 20;
}

#start {
position: absolute;
top: 70px;
left: 50%;
transform: translateX(-50%);
padding: 14px 22px;
border: none;
border-radius: 25px;
background: white;
color: #222;
font-size: 17px;
font-weight: bold;
z-index: 30;
}

.building {
position: absolute;
transform: translate(-50%, -50%);
padding: 7px 10px;
background: rgba(0,0,0,0.75);
color: white;
border-radius: 8px;
white-space: nowrap;
font-size: 15px;
font-weight: bold;
box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

.building::after {
content: "";
position: absolute;
width: 8px;
height: 8px;
background: white;
border-radius: 50%;
bottom: -14px;
left: 50%;
transform: translateX(-50%);
}
</style>
</head>

<body>

<div id="sky">

<div id="title">
Sheffield Skyline
</div>

<button id="start">
Start Compass
</button>

<div id="status">
Waiting to start…
</div>

</div>

<script>

const buildings = [

{
name: "Sheffield Town Hall",
lat: 53.3811,
lon: -1.4701
},

  {
    name: "Hallam Primary School",
    lat: 53.3727,
    lon: -1.5434
  },

{
name: "Park Hill",
lat: 53.3768,
lon: -1.4555
},

{
name: "Arts Tower",
lat: 53.3818,
lon: -1.4882
},

{
name: "St Paul's Place",
lat: 53.3777,
lon: -1.4676
},

{
name: "Sheffield Cathedral",
lat: 53.3831,
lon: -1.4694
}

];


let userLat = null;
let userLon = null;
let heading = null;


const status = document.getElementById("status");
const startButton = document.getElementById("start");


/* ---------------------------
DISTANCE
--------------------------- */

function distance(lat1, lon1, lat2, lon2) {

const R = 6371000;

const p1 = lat1 * Math.PI / 180;
const p2 = lat2 * Math.PI / 180;

const dp =
(lat2 - lat1) *
Math.PI / 180;

const dl =
(lon2 - lon1) *
Math.PI / 180;

const a =
Math.sin(dp / 2) *
Math.sin(dp / 2) +

Math.cos(p1) *
Math.cos(p2) *
Math.sin(dl / 2) *
Math.sin(dl / 2);

const c =
2 *
Math.atan2(
Math.sqrt(a),
Math.sqrt(1 - a)
);

return R * c;
}


/* ---------------------------
BEARING
--------------------------- */

function bearing(lat1, lon1, lat2, lon2) {

const p1 = lat1 * Math.PI / 180;
const p2 = lat2 * Math.PI / 180;

const dl =
(lon2 - lon1) *
Math.PI / 180;

const y =
Math.sin(dl) * Math.cos(p2);

const x =
Math.cos(p1) * Math.sin(p2) -
Math.sin(p1) *
Math.cos(p2) *
Math.cos(dl);

let b =
Math.atan2(y, x) *
180 / Math.PI;

return (b + 360) % 360;
}


/* ---------------------------
SHOW BUILDINGS
--------------------------- */

function updateBuildings() {

if (
userLat === null ||
userLon === null ||
heading === null
) {
return;
}

document
.querySelectorAll(".building")
.forEach(el => el.remove());


buildings.forEach(building => {

const b =
bearing(
userLat,
userLon,
building.lat,
building.lon
);

let difference =
b - heading;

difference =
(difference + 540) % 360 - 180;


/*
Only show buildings
roughly within the
camera's 90° field of view.
*/

if (Math.abs(difference) > 60) {
return;
}


/*
Convert bearing difference
into screen position.
*/

const screenX =
50 +
(difference / 60) * 50;


const marker =
document.createElement("div");

marker.className =
"building";

marker.innerText =
building.name +
  " | " +
  Math.round(b) +
  &deg;


marker.style.left =
screenX + "%";

marker.style.top =
"45%";


document
.getElementById("sky")
.appendChild(marker);

});
}


/* ---------------------------
LOCATION
--------------------------- */

function getLocation() {

if (!navigator.geolocation) {

status.innerText =
"Location isn't available.";

return;
}


status.innerText =
"Getting your location…";


navigator.geolocation.getCurrentPosition(

position => {

userLat =
position.coords.latitude;

userLon =
position.coords.longitude;


status.innerText =
"Location found. Point your phone around.";

updateBuildings();

},

error => {

status.innerText =
"Couldn't get your location: " +
error.message;

},

{
enableHighAccuracy: true,
timeout: 10000,
maximumAge: 0
}
);
}


/* ---------------------------
COMPASS
--------------------------- */

function startCompass() {

if (
typeof DeviceOrientationEvent !==
"undefined" &&
typeof DeviceOrientationEvent.requestPermission ===
"function"
) {

DeviceOrientationEvent
.requestPermission(true)
.then(permission => {

if (permission === "granted") {

window.addEventListener(
"deviceorientation",
handleOrientation,
true
);

status.innerText =
"Compass enabled. Finding location…";

getLocation();

} else {

status.innerText =
"Compass permission was denied.";

}

})
.catch(error => {

status.innerText =
"Compass error: " +
error;

});

} else {

window.addEventListener(
"deviceorientationabsolute",
handleOrientation,
true
);

window.addEventListener(
"deviceorientation",
handleOrientation,
true
);

getLocation();
}
}


/* ---------------------------
ORIENTATION
--------------------------- */

function handleOrientation(event) {

let newHeading = null;


/*
iPhone Safari normally provides
webkitCompassHeading.
*/

if (
typeof event.webkitCompassHeading ===
"number"
) {

newHeading =
event.webkitCompassHeading;

}

/*
Other browsers may provide alpha.
*/

else if (
typeof event.alpha ===
"number"
) {

newHeading =
360 - event.alpha;

}


if (newHeading !== null) {

heading = newHeading;

status.innerText =
"Heading: " +
Math.round(heading) +
"°";

updateBuildings();
}
}


/* ---------------------------
START
--------------------------- */

startButton.addEventListener(
"click",
startCompass
);

</script>

</body>
</html>
